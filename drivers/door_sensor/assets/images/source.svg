<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Door sensor device image: contact sensor and magnet on a door edge, on white. -->
  <defs>
    <linearGradient id="doorEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F3D66"/><stop offset="1" stop-color="#2A4F80"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E9EF"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <!-- door frame (left) and door leaf (right), slightly open -->
  <rect x="120" y="80" width="300" height="840" rx="10" fill="#F1ECE4" stroke="#DCD3C6" stroke-width="6"/>
  <rect x="470" y="80" width="420" height="840" rx="10" fill="url(#doorEdge)"/>
  <rect x="470" y="80" width="10" height="840" fill="#4A6F9E" opacity="0.7"/>
  <rect x="540" y="160" width="280" height="300" rx="8" fill="#1B3659" opacity="0.7"/>
  <rect x="540" y="520" width="280" height="340" rx="8" fill="#1B3659" opacity="0.7"/>
  <!-- magnet on door -->
  <rect x="488" y="400" width="60" height="200" rx="18" fill="url(#shell)" stroke="#CDD3DE" stroke-width="5"/>
  <!-- sensor on frame -->
  <rect x="300" y="360" width="110" height="280" rx="26" fill="url(#shell)" stroke="#CDD3DE" stroke-width="6"/>
  <circle cx="355" cy="420" r="14" fill="#34D399"/>
  <!-- gap waves -->
  <g fill="none" stroke="#1E5EFF" stroke-width="12" stroke-linecap="round" opacity="0.8">
    <path d="M440 470c14 10 22 20 22 30s-8 20-22 30"/>
    <path d="M430 440c26 18 40 38 40 60s-14 42-40 60" opacity="0.5"/>
  </g>
</svg>
