<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Gateway device image: compact wall-plug gateway with LED and radio waves, on white. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E9EF"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <ellipse cx="500" cy="880" rx="240" ry="26" fill="#000" opacity="0.08"/>
  <!-- waves -->
  <g fill="none" stroke="#1E5EFF" stroke-linecap="round" stroke-width="34" opacity="0.9">
    <path d="M360 300c77-72 203-72 280 0"/>
    <path d="M290 210c116-110 304-110 420 0" opacity="0.6"/>
    <path d="M220 120c155-150 405-150 560 0" opacity="0.3"/>
  </g>
  <circle cx="500" cy="365" r="26" fill="#1E5EFF"/>
  <!-- body -->
  <rect x="250" y="420" width="500" height="440" rx="70" fill="url(#shell)" stroke="#CDD3DE" stroke-width="6"/>
  <rect x="290" y="460" width="420" height="360" rx="54" fill="none" stroke="#DCE1E9" stroke-width="4"/>
  <!-- LED -->
  <circle cx="500" cy="640" r="40" fill="#34D399"/>
  <circle cx="500" cy="640" r="40" fill="none" stroke="#1E2230" stroke-width="6" opacity="0.15"/>
  <!-- brand mark: tiny lock -->
  <path fill="#1E2230" fill-rule="evenodd" opacity="0.5" d="M500 740c-14 0-26 12-26 26v10h-4c-5 0-8 3-8 8v38c0 5 3 8 8 8h60c5 0 8-3 8-8v-38c0-5-3-8-8-8h-4v-10c0-14-12-26-26-26zm0 12c8 0 14 6 14 14v10h-28v-10c0-8 6-14 14-14z"/>
</svg>
